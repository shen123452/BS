server:
  port: 8083

spring:
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.glucose: info

app:
  security:
    jwt-secret: ${JWT_SECRET:glucose-dev-only-secret-key-change-in-prod-0123456789abcdef}
    token-ttl-hours: 2
  cors:
    allowed-origins: "*"
  wx:
    appid: ${WX_APPID:}
    secret: ${WX_SECRET:}
  llm:
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    connect-timeout-ms: 3000
    read-timeout-ms: 8000
    max-concurrent: 4
  embedding:
    base-url: ${EMBEDDING_BASE_URL:}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:}
    dim: ${EMBEDDING_DIM:512}
    connect-timeout-ms: 3000
    read-timeout-ms: 8000
  import:
    temp-dir: ${java.io.tmpdir}/glucose-import
    preview-expire-minutes: 30
  qa:
    per-user-hourly-limit: 20
    question-max-length: 500
    retrieval-top-k: 5
    similarity-threshold: 0.60
    total-budget-seconds: 15
  analysis:
    cache-ttl-seconds: 60
