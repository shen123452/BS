server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8082}
  error:
    include-message: never
    include-stacktrace: never
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: hospital-server
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    mysql:
      url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/hospital_triage?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false}
      username: ${MYSQL_USER:root}
      password: ${MYSQL_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
    vector:
      url: ${VECTOR_DB_URL:jdbc:postgresql://127.0.0.1:5433/hospital_triage_vector}
      username: ${VECTOR_DB_USER:hospital_vector_user}
      password: ${VECTOR_DB_PASSWORD:}
      driver-class-name: org.postgresql.Driver
hospital:
  ai:
    base-url: ${BAILIAN_BASE_URL:https://ws-8kbz2v3i6i8sr0hm.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
    api-key: ${DASHSCOPE_API_KEY:}
    chat-model: ${CHAT_MODEL:qwen-plus}
    embedding-model: ${EMBED_MODEL:text-embedding-v4}
    embedding-dimension: ${EMBED_DIMENSION:1024}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
  knowledge:
    storage-path: ${KNOWLEDGE_STORAGE_PATH:./data/knowledge}
    max-file-size: ${KNOWLEDGE_MAX_FILE_SIZE:10485760}
  jwt:
    secret: ${JWT_SECRET}
    expires-in-seconds: 7200
  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
logging:
  level:
    com.shen.hospital: INFO
