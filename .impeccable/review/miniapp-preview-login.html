<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><style>/* 设计令牌：患者血糖记录小程序。浅色、蓝色、清晰、适合日常使用。 */
body {
  --color-ink: #1F2937;
  --color-ink-muted: #5B6773;
  --color-ink-faint: #8A96A3;
  --color-surface: #FFFFFF;
  --color-canvas: #F4F6F8;
  --color-border: #E1E7EE;
  --color-border-strong: #C7D0DB;
  --color-primary: #0B5C8E;
  --color-primary-strong: #08486F;
  --color-accent: #C2412D;
  --color-info: #1B6FAE;
  --color-success: #157A4B;
  --color-warning: #A96500;
  --color-danger: #C0392B;
  --color-demo: #6B4C8A;
  --color-surface-subtle: #EEF3F7;
  --color-danger-subtle: #FBEAE7;
  --color-warning-subtle: #FFF4E0;
  --color-success-subtle: #E7F4EC;
  --color-info-subtle: #E8F1F8;

  background-color: var(--color-canvas);
  color: var(--color-ink);
  font-size: 14px;
  line-height: 1.55;
  font-family: "PingFang SC", "Microsoft YaHei", "DengXian", sans-serif;
}

.page { padding: 12px 12px calc(24px + env(safe-area-inset-bottom)); }
.page-title { font-size: 20px; font-weight: 600; line-height: 1.3; }
.page-subtitle { font-size: 12px; line-height: 1.6; color: var(--color-ink-muted); margin-top: 3px; }
.page-heading { margin-bottom: 12px; }

.card {
  background: var(--color-surface);
  border: 0.5px solid var(--color-border);
  border-radius: 6px;
  padding: 14px;
  margin-bottom: 10px;
}
.card-title { font-size: 15px; font-weight: 600; line-height: 1.4; margin-bottom: 7px; }
.section-heading {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-size: 14px; font-weight: 600; margin: 15px 0 8px;
}
.page-footnote { font-size: 11px; line-height: 1.7; text-align: center; color: var(--color-ink-faint); margin-top: 12px; }
.muted { color: var(--color-ink-muted); font-size: 12px; line-height: 1.6; }
.mono-num, .number { font-variant-numeric: tabular-nums; }
.number { font-size: 32px; line-height: 1.05; font-weight: 600; }
.unit { font-size: 11px; color: var(--color-ink-muted); margin-left: 3px; font-weight: 400; }
.row { display: flex; align-items: center; }
.gap { gap: 8px; }
.flex1 { flex: 1; min-width: 0; }
.mt { margin-top: 10px; }
.tap-active { background-color: #F5F9FC; }

.tag {
  display: inline-flex; align-items: center;
  padding: 1px 6px; border-radius: 3px; font-size: 10.5px; line-height: 16px;
  border: 0.5px solid transparent; white-space: nowrap;
}
.tag-real, .tag-info { color: var(--color-info); background: var(--color-info-subtle); border-color: #CDDFEC; }
.tag-demo { color: var(--color-demo); background: #F1EAF6; border-color: #DCCDE7; }
.tag-warn { color: var(--color-warning); background: var(--color-warning-subtle); border-color: #EBD7B4; }
.tag-danger { color: var(--color-danger); background: var(--color-danger-subtle); border-color: #EBCBC5; }
.tag-success { color: var(--color-success); background: var(--color-success-subtle); border-color: #CFE5D8; }

.btn-primary {
  background: var(--color-primary); color: #FFFFFF;
  border-radius: 4px; font-size: 14px; font-weight: 600;
  min-height: 44px; display: flex; align-items: center; justify-content: center;
}
.btn-primary::after { border: none; }
.btn-primary[disabled] { opacity: .45; }
.btn-plain {
  background: var(--color-surface); color: var(--color-primary);
  border: 0.5px solid var(--color-border-strong); border-radius: 4px;
  font-size: 13.5px; font-weight: 500; min-height: 42px;
  display: flex; align-items: center; justify-content: center;
}
.btn-plain::after { border: none; }
.btn-danger-plain { color: var(--color-danger); border-color: #EBCBC5; }

.chip {
  padding: 5px 11px; border-radius: 4px; font-size: 12.5px;
  border: 0.5px solid var(--color-border-strong);
  background: var(--color-surface); color: var(--color-ink-muted);
}
.chip-active {
  border-color: var(--color-primary); color: var(--color-primary);
  background: var(--color-info-subtle); font-weight: 600;
}

.form-item { margin-bottom: 13px; }
.form-label { font-size: 12px; font-weight: 500; color: var(--color-ink-muted); margin-bottom: 5px; display: block; }
.form-input {
  border: 0.5px solid var(--color-border-strong); border-radius: 4px;
  min-height: 44px; padding: 9px 11px; font-size: 15px; background: var(--color-surface);
  box-sizing: border-box; color: var(--color-ink);
}
.form-help { font-size: 11px; line-height: 1.6; color: var(--color-ink-muted); margin-top: 4px; }
.form-error { font-size: 11.5px; color: var(--color-danger); margin-top: 4px; }

.text-button { min-height: 34px; padding: 0 4px; margin: 0; display: flex; align-items: center; justify-content: center; color: var(--color-primary); background: transparent; border: none; font-size: 12.5px; font-weight: 500; line-height: 1.4; border-radius: 2px; }
.text-button::after { border: none; }
.text-button[disabled] { color: var(--color-ink-faint); opacity: .55; }
button { box-sizing: border-box; }
button.btn-primary, button.btn-plain { width: 100%; margin-left: 0; margin-right: 0; padding: 0 12px; line-height: 1.4; }
button.btn-primary.mt, button.btn-plain.mt { margin-top: 10px; }
button.row.btn-primary, button.row.btn-plain,
.row > button.btn-primary, .row > button.btn-plain,
.record-toolbar > button.btn-primary, .record-toolbar > button.btn-plain { width: auto; }
button.btn-primary[disabled] { background: var(--color-primary); color: #FFFFFF; opacity: .4; }
button.btn-plain[disabled] { color: var(--color-ink-faint); border-color: var(--color-border); }
button.text-button { width: auto; }
.chip { min-height: 34px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; }

.ledger-list { border-top: 0.5px solid var(--color-border); }
.ledger-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 0.5px solid var(--color-border); }
.ledger-main { flex: 1; min-width: 0; }
.ledger-title { font-size: 14px; font-weight: 500; }
.ledger-meta { font-size: 11px; color: var(--color-ink-muted); margin-top: 2px; }
.ledger-value { font-size: 19px; font-weight: 600; }
.ledger-value small { font-size: 10px; color: var(--color-ink-muted); font-weight: 400; margin-left: 2px; }

/* 首屏读数头：医院蓝，白字，信息集中。 */
.readout-head {
  margin: -12px -12px 10px; padding: 13px 12px 11px;
  background: var(--color-primary); color: #FFFFFF;
}
.readout-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.readout-title { font-size: 15px; font-weight: 600; }
.readout-date { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 10.5px; color: rgba(255,255,255,.8); }
.readout-date .tag { color: #FFFFFF; border-color: rgba(255,255,255,.45); background: rgba(255,255,255,.12); }
.readout-grid { display: flex; margin-top: 12px; border-top: 0.5px solid rgba(255,255,255,.25); }
.readout-cell { flex: 1; min-width: 0; padding: 9px 0 0; }
.readout-cell + .readout-cell { border-left: 0.5px solid rgba(255,255,255,.25); padding-left: 12px; }
.readout-source { font-size: 10.5px; color: rgba(255,255,255,.78); }
.readout-value { margin-top: 2px; display: flex; align-items: baseline; }
.readout-value .number { font-size: 32px; color: #FFFFFF; }
.readout-value .unit { color: rgba(255,255,255,.72); }
.readout-time { margin-top: 2px; font-size: 10px; color: rgba(255,255,255,.72); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.readout-foot { margin-top: 2px; font-size: 10px; color: rgba(255,255,255,.65); }

.login-page { min-height: 100vh; background: var(--color-canvas); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 12px; box-sizing: border-box; }
.login-card { width: 100%; background: var(--color-surface); border: 0.5px solid var(--color-border); border-radius: 6px; padding: 0 18px 16px; box-sizing: border-box; overflow: hidden; }
.login-brand { display: flex; align-items: center; gap: 8px; margin: 0 -18px 15px; padding: 15px 18px 11px; background: #F4F9FC; border-bottom: 0.5px solid var(--color-border); }
.brand-mark { width: 26px; height: 26px; border: 1px solid var(--color-primary); border-radius: 4px; position: relative; flex: 0 0 auto; background: var(--color-info-subtle); }
.brand-h { position: absolute; left: 5px; right: 5px; top: 12px; height: 1px; background: var(--color-primary); }
.brand-v { position: absolute; top: 5px; bottom: 5px; left: 12px; width: 1px; background: var(--color-primary); }
.brand-name { font-size: 16px; font-weight: 600; color: var(--color-ink); }
.brand-sub { font-size: 10.5px; color: var(--color-ink-muted); margin-top: 1px; }
.login-title { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
.login-explanation { font-size: 12px; line-height: 1.75; color: var(--color-ink-muted); margin-top: 4px; }
.login-status { margin-top: 8px; }
.consent-row { display: flex; align-items: center; gap: 5px; min-height: 40px; font-size: 12px; margin-top: 9px; color: var(--color-ink); }
.consent-row checkbox { flex-shrink: 0; }
.privacy-link { margin: 0 0 5px; justify-content: flex-start; font-size: 12px; }
.login-submit { width: 100%; }
.login-footnote { color: var(--color-ink-faint); font-size: 10.5px; line-height: 1.8; text-align: center; margin-top: 11px; padding-top: 9px; border-top: 0.5px solid var(--color-border); }
.login-footer { margin-top: 12px; color: var(--color-ink-faint); font-size: 10.5px; text-align: center; }

html,body{margin:0;min-height:100%;} body{width:390px;margin:0 auto;}</style></head><body>
<div class="login-page">
  <div class="login-card">
    <div class="login-brand"><div class="brand-mark"><div class="brand-h"></div><div class="brand-v"></div></div><div><div class="brand-name">血糖记录</div><div class="brand-sub">患者端 · 健康管理</div></div></div>
    <div class="login-title">欢迎使用血糖记录</div>
    <div class="login-explanation">血糖与档案用于记录、分析和已授权的医生管理。智能问答会向模型服务发送问题和必要的数据摘要。</div>
    <div class="login-explanation">本系统提供健康管理参考，不替代诊断、处方或专业医疗建议。</div>
    <label class="consent-row"><span style="width:16px;height:16px;border:1px solid #C7D0DB;display:inline-block;border-radius:2px"></span><span>我已阅读并同意隐私与使用说明</span></label>
    <button class="text-button privacy-link">查看完整说明</button>
    <button class="btn-primary login-submit">同意并微信登录</button>
    <div class="login-footnote"><div>登录确认后，可直接使用问答和其他功能。</div><div>说明与确认记录可在「我的」中查看。</div></div>
  </div>
  <div class="login-footer">健康管理参考 · 不构成诊断建议</div>
</div></body></html>
